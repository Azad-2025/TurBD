<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180" fill="none">
  <defs>
    <linearGradient id="m_shieldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B6A34" />
      <stop offset="40%" stop-color="#0D4820" />
      <stop offset="80%" stop-color="#062D13" />
      <stop offset="100%" stop-color="#041D0C" />
    </linearGradient>
    <linearGradient id="m_shieldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42985D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#021508" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="m_check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3FF3B" />
      <stop offset="50%" stop-color="#78D81C" />
      <stop offset="100%" stop-color="#4EA008" />
    </linearGradient>
    <linearGradient id="m_checkHi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#78D81C" stop-opacity="0" />
    </linearGradient>
    <filter id="m_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g transform="translate(80, 85)" filter="url(#m_shadow)">
    <path
